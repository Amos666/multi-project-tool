name: Build & Package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # tag 推送 + release 上传需要写权限

jobs:
  build:
    name: Retag, Compile & Package VSIX
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout (full history for tag ops)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 读取 package.json 版本号，生成目标 tag（v<version>）
      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}, target tag: ${TAG}"

      # 每次提交都把 tag 移动到当前 commit：
      # - tag 不存在 → 创建
      # - tag 已存在（版本没变）→ 强制刷新到最新 commit
      # 说明：不使用 git push 移动 tag。内置 GITHUB_TOKEN 没有 workflows
      # 权限，当 tag 移动会引入 .github/workflows 变更时 git push 会被
      # 远端拒绝（exit 128）。改用 REST API 更新 ref，只需 contents:write
      # 权限，且目标 commit 已存在于远端，不受该守卫限制。
      - name: Create or refresh tag at current commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # 用 HEAD 而非 github.sha：annotated tag 触发时后者是 tag 对象 SHA
          SHA="$(git rev-parse HEAD)"
          REPO="${{ github.repository }}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} exists, moving it to ${SHA} via API..."
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" \
              -f sha="${SHA}" -F force=true > /dev/null
          else
            echo "Tag ${TAG} not found, creating at ${SHA} via API..."
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${SHA}" > /dev/null
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package VSIX
        run: |
          npx @vscode/vsce --version
          npx @vscode/vsce package --no-git-tag-version --no-update-package-json --allow-star-activation -o multi-project-tool-${{ steps.ver.outputs.version }}.vsix

      - name: Verify VSIX contents
        run: |
          unzip -l multi-project-tool-*.vsix | head -50
          echo "---"
          unzip -l multi-project-tool-*.vsix | grep -E "resources/icon|package.json|extension.js" || true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-project-tool-vsix
          path: multi-project-tool-*.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # PR 不发 Release；push 分支 / push tag / 手动触发都发布
    if: github.event_name != 'pull_request'
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: multi-project-tool-vsix
          path: ./assets

      - name: List downloaded assets
        run: ls -la ./assets

      # tag_name 显式指定：tag 已在 build job 中创建/刷新到当前 commit
      # 同名 Release 已存在时会更新描述，同名 asset 会被覆盖 → 每次提交刷新安装包
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: ./assets/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
